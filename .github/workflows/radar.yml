name: SLK Radar Scanner

on:
  schedule:
    # Runs 6 times a day right after H4 candle closes (01:05, 05:05, 09:05, 13:05, 17:05, 21:05 UTC)
    - cron: '5 1,5,9,13,17,21 * * *'
  workflow_dispatch: # Allows manual trigger anytime via GitHub website

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Radar Scan
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py

      - name: Commit Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update radar state" || exit 0
          git push origin HEAD:${{ github.ref_name }}
          
